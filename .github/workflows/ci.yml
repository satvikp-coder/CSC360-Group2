name: Java 17 verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Headless calculations and rendering
        run: mvn -B --no-transfer-progress verify
      - name: Verify fixture paths outside checkout
        working-directory: ${{ runner.temp }}
        run: mvn -B --no-transfer-progress -f "${{ github.workspace }}/pom.xml" test
