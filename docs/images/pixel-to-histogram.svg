<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320" font-family="Helvetica, Arial, sans-serif">
<rect width="800" height="320" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#222">1. One pixel → one gray value</text>
<rect x="40" y="55" width="70" height="70" fill="rgb(200,100,50)" stroke="#333"/>
<text x="125" y="75" font-size="13" fill="#222">R=200</text>
<text x="125" y="93" font-size="13" fill="#222">G=100</text>
<text x="125" y="111" font-size="13" fill="#222">B=50</text>
<text x="20" y="160" font-size="12" fill="#222">gray = 0.299·R + 0.587·G + 0.114·B</text>
<text x="20" y="180" font-size="12" fill="#222">     = 59.8 + 58.7 + 5.7 = 124.2</text>
<text x="20" y="200" font-size="12" fill="#222">     → round → 124</text>
<rect x="40" y="215" width="70" height="70" fill="rgb(124,124,124)" stroke="#333"/>
<text x="125" y="255" font-size="14" font-weight="bold" fill="#222">124</text>
<text x="255" y="175" font-size="30" fill="#888">→</text>
<text x="295" y="30" font-size="16" font-weight="bold" fill="#222">2. Every pixel → gray</text>
<rect x="315" y="70" width="60" height="60" fill="rgb(50,50,50)" stroke="#333"/>
<text x="345" y="106" font-size="15" text-anchor="middle" fill="#fff">50</text>
<rect x="375" y="70" width="60" height="60" fill="rgb(50,50,50)" stroke="#333"/>
<text x="405" y="106" font-size="15" text-anchor="middle" fill="#fff">50</text>
<rect x="435" y="70" width="60" height="60" fill="rgb(200,200,200)" stroke="#333"/>
<text x="465" y="106" font-size="15" text-anchor="middle" fill="#000">200</text>
<rect x="315" y="130" width="60" height="60" fill="rgb(50,50,50)" stroke="#333"/>
<text x="345" y="166" font-size="15" text-anchor="middle" fill="#fff">50</text>
<rect x="375" y="130" width="60" height="60" fill="rgb(120,120,120)" stroke="#333"/>
<text x="405" y="166" font-size="15" text-anchor="middle" fill="#fff">120</text>
<rect x="435" y="130" width="60" height="60" fill="rgb(200,200,200)" stroke="#333"/>
<text x="465" y="166" font-size="15" text-anchor="middle" fill="#000">200</text>
<rect x="315" y="190" width="60" height="60" fill="rgb(120,120,120)" stroke="#333"/>
<text x="345" y="226" font-size="15" text-anchor="middle" fill="#fff">120</text>
<rect x="375" y="190" width="60" height="60" fill="rgb(200,200,200)" stroke="#333"/>
<text x="405" y="226" font-size="15" text-anchor="middle" fill="#000">200</text>
<rect x="435" y="190" width="60" height="60" fill="rgb(200,200,200)" stroke="#333"/>
<text x="465" y="226" font-size="15" text-anchor="middle" fill="#000">200</text>
<text x="405" y="275" font-size="12" text-anchor="middle" fill="#555">tiny 3×3 image = 9 pixels</text>
<text x="510" y="175" font-size="30" fill="#888">→</text>
<text x="550" y="30" font-size="16" font-weight="bold" fill="#222">3. Count per gray value</text>
<line x1="560" y1="250" x2="780" y2="250" stroke="#333"/>
<rect x="580" y="130" width="40" height="120" fill="#4a7bd0"/>
<text x="600" y="122" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">3</text>
<text x="600" y="268" font-size="13" text-anchor="middle" fill="#222">bin 50</text>
<text x="600" y="286" font-size="12" text-anchor="middle" fill="#4a7bd0">3/9=0.33</text>
<rect x="650" y="170" width="40" height="80" fill="#4a7bd0"/>
<text x="670" y="162" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">2</text>
<text x="670" y="268" font-size="13" text-anchor="middle" fill="#222">bin 120</text>
<text x="670" y="286" font-size="12" text-anchor="middle" fill="#4a7bd0">2/9=0.22</text>
<rect x="720" y="90" width="40" height="160" fill="#4a7bd0"/>
<text x="740" y="82" font-size="14" font-weight="bold" text-anchor="middle" fill="#222">4</text>
<text x="740" y="268" font-size="13" text-anchor="middle" fill="#222">bin 200</text>
<text x="740" y="286" font-size="12" text-anchor="middle" fill="#4a7bd0">4/9=0.44</text>
<text x="560" y="308" font-size="12" fill="#555">normalized = count ÷ 9 (all add to 1)</text>
</svg>